version: 2

models:
  - name: dim_posts
    description: "Dimension table containing descriptive information about posts."
    columns:
      - name: post_id
        description: "Unique identifier for each post."
        data_tests:
          - not_null
          - unique

      - name: title
        description: "Title of the post."

      - name: body
        description: "Body content of the post."

  - name: fact_posts
    description: "Fact table containing measurable characteristics of each post."
    columns:
      - name: post_id
        description: "Identifier linking the fact to dim_posts."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_posts')
              field: post_id

      - name: title_length
        description: "Number of characters in the post title."

      - name: body_length
        description: "Number of characters in the post body."

      - name: total_length
        description: "Total number of characters in the title and body."
